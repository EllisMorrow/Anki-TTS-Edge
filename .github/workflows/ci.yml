name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Anki-TTS-Flet/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r Anki-TTS-Flet/requirements-ci.txt
      - name: Compile source
        run: python -m compileall -q Anki-TTS-Flet scripts tools
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Runtime self-check
        run: python tools/flet_runtime_selfcheck.py
